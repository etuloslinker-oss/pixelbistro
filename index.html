<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Bistro</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d6;--panel:#fffaf0;--ink:#3b2a1a;--line:#3b2a1a;--btn:#ffd36b;--btn2:#ffb347;--ok:#5fbf6a;--bad:#e5604d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f16;--panel:#3a2c20;--ink:#ffeccb;--line:#ffeccb;--btn:#c8923a;--btn2:#a8702a}}
:root[data-theme="dark"]{--bg:#2a1f16;--panel:#3a2c20;--ink:#ffeccb;--line:#ffeccb;--btn:#c8923a;--btn2:#a8702a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Courier New",ui-monospace,monospace;font-weight:700}
#app{max-width:480px;margin:0 auto;padding:8px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}
.hud div{background:var(--panel);border:3px solid var(--line);padding:3px 4px;font-size:13px;text-align:center;white-space:nowrap}
canvas{width:100%;display:block;image-rendering:pixelated;border:3px solid var(--line);background:#000;touch-action:manipulation}
#msg{background:var(--panel);border:3px solid var(--line);padding:6px 8px;margin:6px 0;font-size:13px;min-height:44px}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
button{font:inherit;font-size:12px;color:#3b2a1a;background:var(--btn);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:7px 3px;cursor:pointer;line-height:1.2}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button.on{background:var(--ok)}
button:disabled{opacity:.45}
button:focus-visible{outline:3px solid var(--bad);outline-offset:2px}
#ov,#lk{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#ov .box,#lk .box{background:var(--panel);border:4px solid var(--line);padding:16px;max-width:340px;width:100%;text-align:center}
#ov h2,#lk h2{margin:0 0 8px;font-size:20px}
#ov p,#lk p{margin:4px 0;font-size:14px}
#ov button,#lk button{margin-top:12px;width:100%;font-size:15px;padding:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border-top:2px dashed var(--line);padding:6px 0;font-size:13px}
#ov .row button,#lk .row button{margin:0;width:auto;font-size:12px;padding:5px 8px}
#ob{max-height:60vh;overflow-y:auto}
:root{--bg:#8fd0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16203a}}
:root[data-theme="dark"]{--bg:#16203a}
html,body{font-family:"DotGothic16","Courier New",monospace;font-weight:400;background:var(--bg)}
.hud{gap:3px}
.hud div{background:linear-gradient(#4d86e8,#2257c0);color:#fff;border:3px solid #12337a;border-radius:6px;box-shadow:inset 0 2px 0 #8fb6ff;font-size:14px;text-shadow:0 2px 0 #12337a;padding:3px 2px}
#hm::before{content:"";display:inline-block;width:9px;height:9px;background:#ffd23f;border:2px solid #8a5a00;border-radius:50%;margin-right:4px;vertical-align:-1px}
#hf{color:#ffd23f}
canvas#c{border:4px solid #12337a;border-radius:6px;box-shadow:0 0 0 3px #8fb6ff}
#mw{display:flex;gap:8px;align-items:center;margin:8px 0;background:#fff;color:#3b2a1a;border:3px solid #12337a;border-radius:8px;box-shadow:inset 0 0 0 2px #bcd6ff;padding:6px}
#pt{width:42px;height:78px;image-rendering:pixelated;flex:none;background:#dcecff;border:2px solid #12337a;border-radius:4px}
#msg{border:0;margin:0;padding:0;background:none;font-size:14px;min-height:0;color:#3b2a1a}
button{font-family:inherit;font-size:13px;font-weight:400;color:#5a2d00;background:linear-gradient(#ffe58f,#ffb02e);border:3px solid #8a4b0f;border-radius:7px;box-shadow:0 3px 0 #8a4b0f,inset 0 2px 0 #fff5c4}
button.on{background:linear-gradient(#b8f5a0,#52c24a);border-color:#1f6b2a;box-shadow:0 3px 0 #1f6b2a,inset 0 2px 0 #e4ffd8}
#ov .box,#lk .box{background:#fff;color:#3b2a1a;border:4px solid #12337a;border-radius:10px;box-shadow:inset 0 0 0 3px #bcd6ff}
#ov h2,#lk h2{background:linear-gradient(#4d86e8,#2257c0);color:#fff;border-radius:5px;padding:6px;text-shadow:0 2px 0 #12337a;font-weight:400}
#ov .row,#lk .row{border-top:2px dashed #9db8e0}
#gl{position:relative;margin:8px 0 0;height:28px;background:#fff;border:3px solid #12337a;border-radius:6px;overflow:hidden;color:#3b2a1a;font-size:12px}
#gb{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#ffe58f,#ffb02e)}
#gt{position:relative;display:block;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:82%}
#gc{position:absolute;right:6px;top:4px;color:#d4308f}

/* ---------- Desktop layout: wide screens with a mouse. Phones and tablets keep the layout above. ---------- */
@media (min-width:900px) and (hover:hover) and (pointer:fine){
 #app{max-width:1500px;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"hud hud" "main side" "goal side";column-gap:20px;row-gap:10px;align-items:start}
 .hud{grid-area:hud;margin:0;gap:8px}
 .hud div{font-size:20px;padding:6px 4px;border-radius:8px}
 canvas#c{grid-area:main;justify-self:center;width:min(100%,max(480px,calc((100vh - 170px)*1.4286)));height:auto;cursor:pointer}
 #gl{grid-area:goal;margin:0;height:34px;font-size:15px;width:min(100%,max(480px,calc((100vh - 170px)*1.4286)));justify-self:center}
 #gt{padding:7px 10px;max-width:86%}
 #gc{top:7px;right:10px;font-size:16px}
 #side{grid-area:side;grid-row:2 / span 2;display:flex;flex-direction:column;gap:10px}
 #mw{margin:0;padding:10px;gap:12px;min-height:130px}
 #pt{width:56px;height:104px}
 #msg{font-size:17px;line-height:1.35}
 #side .bar{grid-template-columns:repeat(2,1fr)!important;gap:8px;margin-top:0!important}
 #side .bar:last-child{grid-template-columns:repeat(3,1fr)!important}
 #side button{font-size:16px;padding:10px 6px}
 #side button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
 #side button:active{transform:translateY(2px)}
 #ov .box,#lk .box{max-width:460px;padding:22px}
 #ov h2,#lk h2{font-size:24px}
 #ov p,#lk p{font-size:16px}
 #ov .row,#lk .row{font-size:15px}
 #ov .row button,#lk .row button{font-size:14px;padding:7px 12px}
 #ov button,#lk button{font-size:17px}
 #ob{max-height:62vh}
}
#lk{z-index:9}
</style>
</head>
<body>
<div id="app">
  <div class="hud"><div id="hm"></div><div id="hd"></div><div id="hf"></div><div id="ht"></div></div>
  <canvas id="c" width="320" height="224"></canvas>
  <div id="gl"><div id="gb"></div><span id="gt"></span><b id="gc"></b></div>
  <div id="side">
  <div id="mw"><canvas id="pt" width="14" height="26"></canvas><div id="msg"></div></div>
  <div class="bar">
    <button id="bT">Table $80</button>
    <button id="bP">Decor</button>
    <button id="bX">Remove</button>
    <button id="bC">Hire chef</button>
    <button id="bW">Hire waiter</button>
    <button id="bM">Menu up</button>
  </div>
  <div class="bar" style="margin-top:6px;grid-template-columns:repeat(4,1fr)"><button id="bF">Staff</button><button id="bR">Research</button><button id="bU">Music: off</button><button id="bA">Auto: off</button></div>
  <div class="bar" style="margin-top:6px;grid-template-columns:repeat(3,1fr)">
    <button id="bZ">Zoom in</button><button id="bN">Reset game</button><button id="bK">Save</button>
  </div>
  </div>
</div>
<div id="lk"><div class="box"><h2>Save in use</h2><p id="lkm">This save is already running in another window or device. Only one can play at a time.</p><p id="lks" style="font-size:12px"></p><button id="lkb">Play here instead</button></div></div>
<div id="ov"><div class="box"><h2 id="ot"></h2><div id="ob"></div><button id="og">OK</button></div></div>
<script>
(function(){
var W=20,H=14,T=32,DAY=90;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var MENU=[{n:'Toast',p:8,e:'\uD83C\uDF5E'},{n:'Pasta',p:14,e:'\uD83C\uDF5D'},{n:'Steak',p:22,e:'\uD83E\uDD69'},{n:'Sushi',p:35,e:'\uD83C\uDF63'},{n:'Feast',p:55,e:'\uD83C\uDF71'}];
var UP=[0,120,300,700,1500];
var COL=['#e5604d','#4d9be5','#5fbf6a','#b36ae5','#e5b84d','#e57fb0'];
var S,mode=null,tipI=0,last=0,over=false,acc=0,pz=false,mus=false,ac=null,mg=null,mt=null,ms=0,mi=3,WKL=[],dsel='plant';
function fresh(){return{money:400,day:1,t:0,fame:5,combo:0,tot:0,best:0,gi:0,bestDay:0,staff:[{r:'c',lv:1}],rp:0,res:{},menu:0,tables:[{x:8,y:6,o:null,pd:0},{x:11,y:6,o:null,pd:0}],plants:[],cust:[],fx:[],sp:2,served:0,earn:0,lost:0,open:true,speed:1}}
var SAVE_KEY='pixelbistro4',CLOUD='/api/save',pid=null,cloudOK=false,locked=false,hasLease=false,hbT=null,lastSig='',loadedTs=0,pending=null,pushT=null;
/* CLOUD: URL of the save endpoint. Set to '' to turn cloud saving off (browser-only saving still works). */
function newId(){var a=new Uint8Array(16);(window.crypto||window.msCrypto).getRandomValues(a);return Array.prototype.map.call(a,function(b){return('0'+b.toString(16)).slice(-2)}).join('')}
var sid=null;try{sid=sessionStorage.getItem('pbsid')}catch(e){}
if(!sid||!/^[a-f0-9]{32}$/.test(sid)){sid=newId();try{sessionStorage.setItem('pbsid',sid)}catch(e){}}
function getId(){if(pid)return pid;try{pid=localStorage.getItem('pbid')}catch(e){}if(!pid||!/^[a-f0-9]{32}$/.test(pid)){pid=newId();try{localStorage.setItem('pbid',pid)}catch(e){}}return pid}
function norm(o){
 if(!o||!o.tables||!o.staff)return null;
 o.cust=[];o.fx=[];o.tables.forEach(function(t){t.o=null});o.speed=1;
 var nextDay=false;
 if(!o.ver){if(o.open===false)nextDay=true;else{o.t=0;o.served=0;o.earn=0;o.lost=0;o.sp=2;o.open=true}}
 else if(o.done)nextDay=true;
 if(nextDay){if(o.money<0)return null;o.day++;o.t=0;o.open=true;o.served=0;o.earn=0;o.lost=0;o.sp=2;o.done=false}
 if(o.t==null)o.t=0;if(o.sp==null)o.sp=2;if(o.open==null)o.open=true;
 return o}
function readLocal(){try{var s=localStorage.getItem(SAVE_KEY);if(s)return JSON.parse(s)}catch(e){}return null}
function load(){var o=readLocal();loadedTs=(o&&o.ts)||0;return norm(o)||fresh()}
function snap(){var c={},k;for(k in S)if(k!='cust'&&k!='fx'&&k!='tables'&&k!='ts')c[k]=S[k];c.tables=S.tables.map(function(t){return{x:t.x,y:t.y,o:null,pd:t.pd}});c.ver=2;return c}
function save(force){
 if(locked)return;
 try{var c=snap(),sig=JSON.stringify(c);if(sig===lastSig&&!force)return;
  lastSig=sig;c.ts=Date.now();var js=JSON.stringify(c);
  try{localStorage.setItem(SAVE_KEY,js)}catch(e){}
  queuePush(js)}catch(e){}}
function queuePush(js){pending=js;if(!CLOUD||!cloudOK||pushT)return;pushT=setTimeout(function(){pushT=null;flush()},8000)}
function flush(){if(!CLOUD||!cloudOK||!pending||locked)return;var js=pending;pending=null;
 try{fetch(CLOUD+'?id='+getId()+'&sid='+sid,{method:'POST',headers:{'Content-Type':'text/plain'},body:js,keepalive:js.length<60000}).then(function(r){if(r.status==409){pending=null;lostLease();return}if(!r.ok&&!pending)pending=js}).catch(function(){if(!pending)pending=js})}catch(e){if(!pending)pending=js}}
S=load();
var $=function(i){return document.getElementById(i)};
function msg(t){$('msg').textContent=t}
var tips=['Tap a tile to build. Tables bring in more guests.','Chefs and waiters cut waiting time. Patient guests pay.','Plants make the room prettier and raise tips.','Better menus sell for more. Upgrade when you can.','Fame brings crowds. Keep guests happy to climb the stars.'];
function stars(){return Math.min(10,1+Math.floor((S.fame+dsc())/30))}
function price(){return Math.round(MENU[S.menu].p*(1+dv())*(1+0.1*(stars()-1))*(1+(S.res.c3?0.1:0)+(S.res.c5?0.1:0)+(S.res.m3?0.15:0)))}
var RES=[{id:'c1',n:'Sharp Knives',d:'Cooking +0.6',cost:10,req:null},{id:'c2',n:'Gas Ranges',d:'Cooking +0.9',cost:25,req:'c1'},{id:'c3',n:'Master Recipes',d:'Cooking +1.2, prices +10%',cost:50,req:'c2'},{id:'s1',n:'Order Pads',d:'Serving +0.5',cost:10,req:null},{id:'s2',n:'Tray Training',d:'Serving +0.8',cost:25,req:'s1'},{id:'s3',n:'Table Numbers',d:'Serving +1.0, guests wait 4s longer',cost:50,req:'s2'}];
var BON={c1:.6,c2:.9,c3:1.2,s1:.5,s2:.8,s3:1};
function sl(r){var n=0;S.staff.forEach(function(s){if(s.r==r)n+=s.lv});return n}
function cnt(r){return S.staff.filter(function(s){return s.r==r}).length}
function rb(p){var n=0;for(var k in BON)if(k[0]==p&&S.res[k])n+=BON[k];return n}
function cookP(){return sl('c')*1.3+rb('c')}
function servP(){return sl('w')*0.9+rb('s')}
function patience(){return 14+(S.res.s3?4:0)+(S.res.s5?4:0)}
function wage(s){return 8+s.lv*6}
function occupied(x,y){var i;for(i=0;i<S.tables.length;i++)if(S.tables[i].x==x&&S.tables[i].y==y)return 1;for(i=0;i<S.plants.length;i++)if(S.plants[i].x==x&&S.plants[i].y==y)return 1;return 0}
function setMode(m){if(typeof zcancel=='function')zcancel();mode=(mode===m)?null:m;$('bT').className=mode=='t'?'on':'';$('bP').className=mode=='p'?'on':'';$('bX').className=mode=='x'?'on':'';
 if(mode=='t')msg('Tap an empty floor tile to place a table ($'+tcost()+').');else if(mode=='p')msg('Tap an empty floor tile to place: '+DEC[dsel].n+' ($'+DEC[dsel].c+'). Tap Decor to pick another.');else if(mode=='x')msg('Tap a table or decor to remove it and get 70% of its price back.');else msg(tips[tipI%tips.length])}
$('bT').onclick=function(){setMode('t')};$('bP').onclick=function(){setMode('p')};$('bX').onclick=function(){setMode('x')};
$('bC').onclick=function(){if(cnt('c')>=maxStaff())return msg('Kitchen full for your level (max 8). Level up to hire more.');var hcost=hireCost('c');if(S.money<hcost)return msg('Hiring a chef costs $'+hcost+'.');S.money-=hcost;S.staff.push({r:'c',lv:1});msg('Chef hired. Food comes out faster now.')};
$('bW').onclick=function(){if(cnt('w')>=maxStaff())return msg('Floor staff full for your level (max 8). Level up to hire more.');var hw=hireCost('w');if(S.money<hw)return msg('Hiring a waiter costs $'+hw+'.');S.money-=hw;S.staff.push({r:'w',lv:1});msg('Waiter hired. Guests get served sooner.')};
$('bM').onclick=function(){if(S.menu>=MENU.length-1)return msg('Your menu is already the best in town.');var c=UP[S.menu+1];if(S.money<c)return msg('Menu upgrade costs $'+c+'.');S.money-=c;S.menu++;msg('New dish: '+MENU[S.menu].n+'! Price is now $'+price()+'.')};
function ask(title,text,yes,fn){openPanel(title,'<p>'+text+'</p><div class="row"><button id="qn">Cancel</button><button id="qy">'+yes+'</button></div>');$('qn').onclick=closePanel;$('qy').onclick=function(){closePanel();fn()}}
function doReset(){S=fresh();over=false;pz=false;mode=null;WKL=[];$('bT').className='';$('bP').className='';$('bX').className='';$('ov').style.display='none';save(true);flush();msg('A fresh start. Build your first tables.')}
$('bN').onclick=function(){ask('Reset game?','This erases your whole restaurant and starts over. It cannot be undone.','Reset',doReset)};
cv.addEventListener('tap',function(e){
 var x=e.tx,y=e.ty,i;
 if(zpick){zpick=false;zoomAt(e.wx,e.wy,ZIN);msg('Zoomed in. Drag to move around, or use Zoom out.');return}
 if(!mode)return;
 if(mode=='x'){for(i=0;i<S.tables.length;i++)if(S.tables[i].x==x&&S.tables[i].y==y){if(S.tables[i].o)return msg('A guest is sitting there.');var pv=S.tables[i].pd!=null?S.tables[i].pd:Math.round(80*Math.pow(1.045,i)),rt=Math.floor(pv*0.7);S.tables.splice(i,1);S.money+=rt;coin(x*T+T/2,y*T,'+$'+fm(rt));return msg('Table removed. Refunded $'+fm(rt)+' (70%).')}
  for(i=0;i<S.plants.length;i++)if(S.plants[i].x==x&&S.plants[i].y==y){var rf=Math.floor(DEC[S.plants[i].t||'plant'].c*0.7);S.plants.splice(i,1);S.money+=rf;coin(x*T+T/2,y*T,'+$'+fm(rf));return msg('Decor removed. Refunded $'+fm(rf)+' (70%).')}
  return msg('Nothing to remove on that tile.')}
 if(y<1||y>=H-1)return msg('Build on the dining floor, not the kitchen or door.');
 if(occupied(x,y))return msg('That tile is taken.');
 if(mode=='t'){var tc=tcost();if(S.tables.length>=maxTables())return msg('Table limit for your level is '+maxTables()+'. Level up for more.');if(S.money<tc)return msg('A table costs $'+tc+'.');S.money-=tc;S.tables.push({x:x,y:y,o:null,pd:tc});msg('Table placed.')}
 else{var dd=DEC[dsel];if(LV()<(dd.rq||1))return msg(dd.n+' unlocks at level '+dd.rq+'.');if(S.money<dd.c)return msg(dd.n+' costs $'+dd.c+'.');S.money-=dd.c;S.plants.push({x:x,y:y,t:dsel});msg(dd.n+' placed. Lovely.')}
});
function coin(x,y,t,c){S.fx.push({x:x,y:y,t:t,c:c||'#ffd23f',a:1.2})}
function newCust(){S.cust.push({x:10*T,y:H*T+8,st:'in',pat:10,tb:null,tm:0,col:COL[Math.floor(Math.random()*COL.length)],bob:Math.random()*6})}
function moveTo(c,tx,ty,dt){var dx=tx-c.x,dy=ty-c.y,d=Math.sqrt(dx*dx+dy*dy),s=75*dt;if(d<=s){c.x=tx;c.y=ty;return true}c.x+=dx/d*s;c.y+=dy/d*s;return false}
function update(dt){
 var i,c;
 if(S.open){S.t+=dt;S.sp-=dt;
  if(S.sp<=0&&S.cust.length<S.tables.length+8){newCust();S.sp=spawnInt()}
  if(S.t>=DAY){S.open=false;msg('Closing time! Waiting for the last guests to finish.')}}
 var need=Math.max(2.5,9*Math.pow(.95,cookP())),pt=patience();stepW(dt);chkGoal();
 for(i=S.cust.length-1;i>=0;i--){c=S.cust[i];c.bob+=dt*8;
  if(c.st=='in'){c.pat-=dt;moveTo(c,(9+(i%2))*T+T/2,(H-1)*T+24,dt);
   var free=null,j;for(j=0;j<S.tables.length;j++)if(!S.tables[j].o){free=S.tables[j];break}
   if(free){free.o=c;c.tb=free;c.st='walk'}
   else if(c.pat<=0){S.fame=Math.max(0,S.fame-0.4);S.combo=0;S.lost++;c.st='leave'}}
  else if(c.st=='walk'){if(moveTo(c,c.tb.x*T+T/2,c.tb.y*T+T/2+8,dt)){c.st='wait';c.tm=0}}
  else if(c.st=='wait'){c.tm+=dt;
   if(c.tm>=need&&!c.ready){c.ready=true;c.rt=0}if(c.ready){c.rt+=dt;if(!WKL.length&&c.rt>=3){c.st='eat';c.eat=4}}
   if(c.st=='wait'&&c.tm>=pt){c.tb.o=null;c.tb=null;S.fame=Math.max(0,S.fame-0.8);S.combo=0;S.lost++;c.st='leave';coin(c.x,c.y-20,'Angry!','#e5604d')}}
  else if(c.st=='eat'){c.eat-=dt;if(c.eat<=0){var p=price(),tp=Math.floor(p*Math.min(0.3,S.combo*0.02));p+=tp;S.combo++;S.best=Math.max(S.best||0,S.combo);S.tot=(S.tot||0)+1;S.money+=p;S.earn+=p;S.served++;S.rp++;S.fame+=0.6*famef();coin(c.x,c.y-20,'+$'+fm(p)+(S.combo>2?' x'+S.combo:''));if(S.combo%5==0)coin(c.x,c.y-32,'COMBO!','#ff7ad9');sfx([988,1319]);c.tb.o=null;c.tb=null;c.st='leave'}}
  else if(c.st=='leave'){if(moveTo(c,10*T,H*T+10,dt))S.cust.splice(i,1)}}
 for(i=S.fx.length-1;i>=0;i--){S.fx[i].a-=dt;S.fx[i].y-=dt*14;if(S.fx[i].a<=0)S.fx.splice(i,1)}
 if(!S.open&&S.cust.length==0)endDay();

 var h='<p style="font-size:12px">Money $'+fm(S.money)+'. Staff level cap: '+trainMax()+' (rises with restaurant level). Pay is due each evening.</p><div class="row"><button data-all="1">Train all x1</button><button data-all="10">Train all x10</button></div>';
 S.staff.forEach(function(s,i){var cost=trainCost(s);
  h+='<div class="row"><span>'+(s.r=='c'?'Chef':'Waiter')+' Lv'+s.lv+' <small>$'+fm(wage(s))+'/day</small></span>'+(s.lv>=trainMax()?'<span>Cap</span>':'<button data-i="'+i+'"'+(S.money<cost?' disabled':'')+'>Train $'+fm(cost)+'</button>')+'</div>'});
 openPanel('Staff',h);
 var ob=$('ob');
 ob.querySelectorAll('button[data-i]').forEach(function(b){b.onclick=function(){var s=S.staff[b.dataset.i],c=trainCost(s);if(S.money>=c&&s.lv<trainMax()){S.money-=c;s.lv++;staffPanel()}}});
 ob.querySelectorAll('button[data-all]').forEach(function(b){b.onclick=function(){var n=+b.dataset.all;for(var r=0;r<n;r++)S.staff.slice().sort(function(a,c){return a.lv-c.lv}).forEach(function(s){var c=trainCost(s);if(S.money>=c&&s.lv<trainMax()){S.money-=c;s.lv++}});staffPanel()}})
}
function resPanel(){
 var h='<p style="font-size:12px">Research points: '+fm(S.rp)+'. You earn them from guests, level-ups and stars.</p>';
 BR.forEach(function(b){var n=rl(b[0]),nx=RES.filter(function(r){return r.id==b[0]+(n+1)})[0];
  h+='<div class="row"><span><b>'+b[1]+'</b> '+n+'/12<br><small>'+(nx?nx.n+': '+nx.d:'Complete')+'</small></span>'+(nx?(LV()<nx.rq?'<span>Lv '+nx.rq+'</span>':'<button data-r="'+nx.id+'"'+(S.rp<nx.cost?' disabled':'')+'>'+fm(nx.cost)+' RP</button>'):'<span>Done</span>')+'</div>'});
 openPanel('Research',h);
 $('ob').querySelectorAll('button[data-r]').forEach(function(b){b.onclick=function(){var r=RES.filter(function(x){return x.id==b.dataset.r})[0];if(S.rp>=r.cost&&!S.res[r.id]&&LV()>=r.rq){S.rp-=r.cost;S.res[r.id]=1;resPanel()}}})}
function decPanel(){
 var L=LV(),h='<p style="font-size:12px">Money $'+fm(S.money)+'. Decor bonus +'+Math.round(dv()*50)+'% to prices (max +400%). Decor also counts toward your star rating.</p>';
 Object.keys(DEC).sort(function(a,b){return DEC[a].c-DEC[b].c}).forEach(function(k){var d=DEC[k],lock=L<(d.rq||1),own=S.plants.filter(function(p){return (p.t||'plant')==k}).length;
  h+='<div class="row"><img src="'+d.s.toDataURL()+'" width="32" height="32" style="image-rendering:pixelated"><span style="flex:1">'+d.n+'<br><small>+'+Math.round(d.b*50)+'% prices | owned '+own+'</small></span>'+(lock?'<span>Lv '+d.rq+'</span>':'<button data-d="'+k+'"'+(S.money<d.c?' disabled':'')+'>$'+fm(d.c)+'</button>')+'</div>'});
 openPanel('Decor catalog',h);
 $('ob').querySelectorAll('button[data-d]').forEach(function(b){b.onclick=function(){dsel=b.dataset.d;closePanel();mode=null;setMode('p')}})}
$('bF').onclick=staffPanel;$('bR').onclick=resPanel;$('bP').onclick=decPanel;
$('bM').onclick=function(){if(S.menu>=MENU.length-1)return msg('Your menu is complete. Legendary!');var n=S.menu+1,c=UP[n],rq=menuReq(n);if(LV()<rq)return msg(MENU[n].n+' unlocks at level '+rq+'.');if(S.money<c)return msg('Menu upgrade costs $'+fm(c)+'.');S.money-=c;S.menu=n;msg('New dish: '+MENU[n].n+'! Price is now $'+fm(price())+'.')};
$('bA').onclick=function(){S.auto=!S.auto};
var cam={x:0,y:0},Z=.5,drag=null;
function clampCam(){cam.x=Math.max(0,Math.min(W*T-320/Z,cam.x));cam.y=Math.max(0,Math.min(H*T-224/Z,cam.y))}
cv.style.touchAction='none';
cv.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,m:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',function(e){if(!drag)return;var r=cv.getBoundingClientRect(),k=320/r.width/Z,dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.m=true;if(drag.m){cam.x=drag.cx-dx*k;cam.y=drag.cy-dy*k;clampCam()}});
cv.addEventListener('pointercancel',function(){drag=null});
cv.addEventListener('pointerup',function(e){var d=drag;drag=null;if(!d||d.m)return;var r=cv.getBoundingClientRect(),k=320/r.width,wx=cam.x+(e.clientX-r.left)*k/Z,wy=cam.y+(e.clientY-r.top)*k/Z,ev=new Event('tap');ev.tx=Math.floor(wx/T);ev.ty=Math.floor(wy/T);ev.wx=wx;ev.wy=wy;cv.dispatchEvent(ev)});
var zpick=false,ZMIN=.5,ZMAX=2,ZIN=1.25;
function zlabel(){var b=$('bZ');b.textContent=Z>ZMIN+.01?'Zoom out':'Zoom in';b.className=zpick?'on':'';cv.style.cursor=zpick?'crosshair':''}
function zoomAt(wx,wy,nz){Z=Math.max(ZMIN,Math.min(ZMAX,nz));cam.x=wx-160/Z;cam.y=wy-112/Z;clampCam();zlabel()}
function zcancel(){if(zpick){zpick=false;zlabel()}}
$('bZ').onclick=function(){
 if(Z>ZMIN+.01){zpick=false;zoomAt(cam.x+160/Z,cam.y+112/Z,ZMIN);msg('Zoomed out.');return}
 zpick=!zpick;zlabel();msg(zpick?'Tap the part of the restaurant you want to zoom into.':tips[tipI%tips.length])};
cv.addEventListener('wheel',function(e){e.preventDefault();var r=cv.getBoundingClientRect(),k=320/r.width,sx=(e.clientX-r.left)*k,sy=(e.clientY-r.top)*k,wx=cam.x+sx/Z,wy=cam.y+sy/Z;
 Z=Math.max(ZMIN,Math.min(ZMAX,Z*(e.deltaY<0?1.15:1/1.15)));cam.x=wx-sx/Z;cam.y=wy-sy/Z;clampCam();zlabel()},{passive:false});
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#2b3a55';ctx.fillRect(0,0,320,224);
 ctx.setTransform(Z,0,0,Z,-Math.round(cam.x*Z),-Math.round(cam.y*Z));
 drawW();
 ctx.setTransform(1,0,0,1,0,0);
 if(!S.open&&!over){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,320,13);ctx.fillStyle='#fff';ctx.font='10px DotGothic16, monospace';ctx.textAlign='center';ctx.fillText('CLOSED - finishing up',160,10)}
}
var CH=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]],PE=[0,2,4,7,9,12,14,16];
function hz(n){return 261.63*Math.pow(2,n/12)}
function tone(f,t,d,ty,v){var o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+0.05)}
function step(){if(!mus||!ac)return;var t=ac.currentTime+0.05,bar=Math.floor(ms/8)%4,k=ms%8;
 if(k%4==0)CH[bar].forEach(function(n){tone(hz(n-12),t,1.5,'sine',0.06)});
 if(Math.random()<0.7){mi=Math.max(0,Math.min(7,mi+Math.floor(Math.random()*5)-2));tone(hz(PE[mi]),t,0.55,'triangle',0.05)}
 ms++}
function musicOn(on){mus=on;$('bU').textContent='Music: '+(on?'on':'off');try{localStorage.setItem('pbmusic',on?'1':'0')}catch(e){}
 if(on){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(!A){mus=false;return}ac=new A();mg=ac.createGain();mg.gain.value=0.5;mg.connect(ac.destination)}if(ac.state=='suspended')ac.resume();if(!mt)mt=setInterval(step,300)}else if(mt){clearInterval(mt);mt=null}}
$('bU').onclick=function(){musicOn(!mus)};
var pref=false;try{pref=localStorage.getItem('pbmusic')=='1'}catch(e){}
if(pref)document.addEventListener('pointerdown',function f(e){document.removeEventListener('pointerdown',f);if(e.target.id!='bU')musicOn(true)});
try{$('pt').getContext('2d').drawImage(sprP('#ff8fb3','#3a6fd8','#ffd9b0',0,'s'),0,0)}catch(e){}

function applyCloud(o,quiet){var n=norm(o);if(!n)return false;S=n;over=false;pz=false;$('ov').style.display='none';pending=null;loadedTs=o.ts||0;save(true);if(!quiet)msg('Loaded your cloud save.');return true}
/* ---- one running copy per save code ---- */
function api(action,force,id){return fetch(CLOUD+'?id='+(id||getId())+'&sid='+sid+'&action='+action+(force?'&force=1':''),{method:'POST',headers:{'Content-Type':'text/plain'},body:'{}',keepalive:true})}
function claim(force,id){return api('claim',force,id).then(function(r){if(r.status==404)return 'off';if(!r.ok)throw new Error('http '+r.status);return r.json()}).then(function(j){return j==='off'?'off':(j&&j.ok?'ok':'busy')})}
function fetchSave(id){return fetch(CLOUD+'?id='+(id||getId())).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()}).then(function(j){var o=null;try{if(j&&j.data)o=typeof j.data=='string'?JSON.parse(j.data):j.data}catch(e){}return o})}
function startBeat(){hasLease=true;locked=false;$('lk').style.display='none';if(hbT)clearInterval(hbT);
 hbT=setInterval(function(){if(!hasLease)return;if(pending&&cloudOK){flush();return}claim(false).then(function(r){if(r=='busy')lostLease()}).catch(function(){})},10000)}
function lostLease(){hasLease=false;locked=true;pending=null;if(hbT){clearInterval(hbT);hbT=null}showLock('This save was opened in another window or device, so this one has stopped. Only one can run a save at a time.')}
function showLock(m){locked=true;hasLease=false;$('lkm').textContent=m||'This save is already running in another window or device. Only one can play at a time.';$('lks').textContent='';$('lk').style.display='flex'}
$('lkb').onclick=function(){var st=$('lks');st.textContent='Taking over...';
 claim(true).then(function(r){
  if(r!='ok'){st.textContent='Could not reach the server. Try again.';return}
  return fetchSave().then(function(o){startBeat();cloudOK=true;if(o){if(!applyCloud(o,true))save(true)}else save(true);msg('Continuing your save here.')})
 }).catch(function(){st.textContent='Could not reach the server. Try again.'})};
var pullTries=0;
function pull(){
 if(!CLOUD||!/^https?:$/.test(location.protocol))return;
 claim(false).then(function(r){
  if(r=='off')return;
  if(r=='busy'){showLock();return}
  startBeat();
  return fetchSave().then(function(o){
   if(o&&o.ts>loadedTs)applyCloud(o);
   cloudOK=true;if(pending)queuePush(pending)})
 }).catch(function(){if(++pullTries<10)setTimeout(pull,30000)})}
function persist(){save();flush()}
document.addEventListener('visibilitychange',function(){if(document.visibilityState=='hidden')persist()});
window.addEventListener('pagehide',function(){persist();if(CLOUD&&hasLease&&navigator.sendBeacon){try{navigator.sendBeacon(CLOUD+'?id='+getId()+'&sid='+sid+'&action=release','{}')}catch(e){}}});
window.addEventListener('pageshow',function(e){if(e.persisted&&CLOUD){hasLease=false;cloudOK=false;pullTries=0;pull()}});
window.addEventListener('beforeunload',persist);
setInterval(save,3000);
document.addEventListener('click',function(){setTimeout(save,60)});
function savePanel(){
 var h='<p style="font-size:12px">Your game saves automatically on this device'+(CLOUD?' and to the cloud':'')+'.</p>';
 if(CLOUD)h+='<p style="font-size:12px">Save code (keep it private). Use it to continue the same game on another device. Only one window can run a save at a time; opening it elsewhere stops this one.</p><div class="row"><input id="kc" readonly value="'+getId()+'" style="flex:1;min-width:0;font:inherit;font-size:11px"><button id="kcp">Copy</button></div><div class="row"><input id="kin" placeholder="paste a save code" style="flex:1;min-width:0;font:inherit;font-size:11px"><button id="kld">Load</button></div><p id="kst" style="font-size:12px"></p>';
 openPanel('Save',h);
 if(!CLOUD)return;
 var st=function(t){$('kst').textContent=t};
 $('kcp').onclick=function(){var el=$('kc');el.select();try{navigator.clipboard.writeText(el.value).then(function(){st('Copied.')},function(){document.execCommand('copy');st('Copied.')})}catch(e){try{document.execCommand('copy');st('Copied.')}catch(_){st('Select and copy the code.')}}};
 $('kld').onclick=function(){var code=$('kin').value.trim().toLowerCase();if(!/^[a-f0-9]{32}$/.test(code))return st('That code does not look right.');
  st('Looking...');
  fetchSave(code).then(function(o){
   if(!o)return st('No save found for that code.');
   var old=getId();
   var go=function(force){
    claim(force,code).then(function(r){
     if(r=='off')return msg('Could not reach the server.');
     if(r=='busy')return ask('Save in use','That save is running in another window or device. Take it over? The other one will stop.','Take over',function(){go(true)});
     if(old!==code){try{api('release',false,old)}catch(e){}}
     pid=code;try{localStorage.setItem('pbid',code)}catch(e){}
     fetchSave(code).catch(function(){return o}).then(function(f){startBeat();cloudOK=true;applyCloud(f||o)})
    }).catch(function(){msg('Could not reach the server.')})};
   ask('Load save?','Replace the game on this device with that save? It will keep saving to that code.','Load',function(){go(false)})
  }).catch(function(){st('Could not reach the server.')})}
}
$('bK').onclick=savePanel;
pull();
msg('Welcome to Pixel Bistro! Serve guests, earn coins, and grow your restaurant.');
requestAnimationFrame(loop);
})();
